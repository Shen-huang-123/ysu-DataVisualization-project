name: IOC historical results connectivity probe

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/ioc-connectivity-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Check historical result pages
        shell: bash
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          import json
          from pathlib import Path
          import urllib.error
          import urllib.request

          urls = {
              'beijing_2008_archery': 'https://olympics.com/en/olympic-games/beijing-2008/results/archery',
              'london_2012_archery': 'https://olympics.com/en/olympic-games/london-2012/results/archery',
              'rio_2016_archery': 'https://olympics.com/en/olympic-games/rio-2016/results/archery',
          }
          results = []
          for key, url in urls.items():
              request = urllib.request.Request(url, headers={
                  'User-Agent': 'Mozilla/5.0 (compatible; academic result verification)',
                  'Accept': 'text/html',
              })
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      body = response.read(200000).decode('utf-8', 'replace')
                      results.append({
                          'key': key, 'url': response.url, 'status': response.status,
                          'html_bytes_read': len(body.encode('utf-8')),
                          'has_result_marker': any(marker in body.lower() for marker in ('medal', 'result', 'archery')),
                          'title': body.split('<title>', 1)[1].split('</title>', 1)[0][:160] if '<title>' in body else '',
                      })
              except (urllib.error.URLError, TimeoutError, OSError) as error:
                  results.append({'key': key, 'url': url, 'error': str(error)[:180]})
          output = {
              'checked_at_utc': datetime.now(timezone.utc).isoformat(),
              'workflow_run': 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}',
              'results': results,
          }
          Path('项目工作区/ioc_github_connectivity_probe.json').write_text(
              json.dumps(output, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('IOC_PROBE_JSON=' + json.dumps(results, ensure_ascii=False))
          PY
      - name: Check one page with Chrome
        shell: bash
        run: |
          npm install --no-save playwright-core
          node <<'JS'
          const fs = require('fs');
          const { chromium } = require('playwright-core');
          (async () => {
            const file = '项目工作区/ioc_github_connectivity_probe.json';
            const output = JSON.parse(fs.readFileSync(file, 'utf8'));
            const url = 'https://olympics.com/en/olympic-games/rio-2016/results/archery';
            let browser;
            const result = { url };
            try {
              browser = await chromium.launch({ channel: 'chrome', headless: true });
              const page = await browser.newPage();
              const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 25000 });
              result.status = response?.status();
              result.final_url = page.url();
              result.title = await page.title();
              result.visible_text_sample = (await page.locator('body').innerText()).slice(0, 240);
            } catch (error) {
              result.error = String(error).slice(0, 240);
            } finally {
              if (browser) await browser.close();
            }
            output.chrome_probe = result;
            fs.writeFileSync(file, JSON.stringify(output, null, 2) + '\n');
            console.log('IOC_CHROME_PROBE=' + JSON.stringify(result));
          })();
          JS
      - name: Save probe result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '项目工作区/ioc_github_connectivity_probe.json'
          git commit -m 'Record IOC connectivity probe result'
          git push
