name: IOC historical results connectivity probe

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/ioc-connectivity-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check historical result pages
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.request

          urls = {
              'beijing_2008_archery': 'https://www.olympics.com/en/olympic-games/beijing-2008/results/archery',
              'london_2012_archery': 'https://www.olympics.com/en/olympic-games/london-2012/results/archery',
              'rio_2016_archery': 'https://www.olympics.com/en/olympic-games/rio-2016/results/archery',
          }
          results = []
          for key, url in urls.items():
              request = urllib.request.Request(url, headers={
                  'User-Agent': 'Mozilla/5.0 (compatible; academic result verification)',
                  'Accept': 'text/html',
              })
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      body = response.read(200000).decode('utf-8', 'replace')
                      results.append({
                          'key': key, 'url': response.url, 'status': response.status,
                          'html_bytes_read': len(body.encode('utf-8')),
                          'has_result_marker': any(marker in body.lower() for marker in ('medal', 'result', 'archery')),
                          'title': body.split('<title>', 1)[1].split('</title>', 1)[0][:160] if '<title>' in body else '',
                      })
              except (urllib.error.URLError, TimeoutError, OSError) as error:
                  results.append({'key': key, 'url': url, 'error': str(error)[:180]})
          print('IOC_PROBE_JSON=' + json.dumps(results, ensure_ascii=False))
          PY
