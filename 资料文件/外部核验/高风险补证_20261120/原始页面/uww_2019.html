ov-fails-london-re-test#article\",\"isPartOf\":{\"@id\":\"https://uww.org/articles/ioc-determines-taymazov-fails-london-re-test\"},\"mainEntityOfPage\":{\"@id\":\"https://uww.org/articles/ioc-determines-taymazov-fails-london-re-test\"},\"url\":\"https://uww.org/articles/ioc-determines-taymazov-fails-london-re-test\",\"headline\":\"IOC Determines Taymazov Fails London Re-Test\",\"description\":\"The IOC Disciplinary Commission (DC) rendered its decision against Artur TAYMAZOV (UZB) who failed a reanalysis of his anti-doping test at the 2012 Olympic Games in London.\",\"author\":{\"@id\":\"https://uww.org/authors/united-world-wrestling-press#person\",\"name\":\"United World Wrestling Press\"},\"datePublished\":\"2019-07-26T13:13:10+00:00\",\"dateModified\":\"2019-07-26T13:17:27+00:00\",\"articleBody\":\"The IOC Disciplinary Commission (DC) rendered its decision against Artur TAYMAZOV (UZB) who failed a reanalysis of his anti-doping test at the 2012 Olympic Games in London. CORSIER-SUR-VEVEY, Switzerland (July 26) – The IOC Disciplinary Commission (DC) rendered its decision against Artur TAYMAZOV (UZB) who failed a reanalysis of his anti-doping test at the 2012 Olympic Games in London. Taymazov tested positive for the prohibited substance dehydrochlormethyltestosterone (oral turinabol). The Uzbek wrestler had earned a gold medal in freestyle wrestling at 120kg and his removal will re-shuffle the order of medalists at the 2012 London Games. Komeil GHASEMI (IRI) will become the new gold medalist, Bilyal MAKHOV (RUS) remains silver, and Tervel DLAGNEV (USA) will be the newest bronze medalist. Gold: Komeil GHASEMI (IRI) Silver: Bilyal MAKHOV (RUS) Bronze: Tervel DLAGNEV (USA) Bronze: Daulet SHABANBAY (KAZ) Taymazov may opt to appeal the IOC DC decision before CAS within 21 days. United World Wrestling will then determine the sanctions faced by the athlete.\",\"wordCount\":162,\"publisher\":{\"@id\":\"https://uww.org/#organization\"},\"image\":{\"@id\":\"https://uww.org/articles/ioc-determines-taymazov-fails-london-re-test#primaryimage\"},\"thumbnailUrl\":\"https://cdn.uww.org/styles/max_1300_16_9/public/2019-07/2644091-54704250-2560-1440.jpg?itok=04cSbNCi\",\"keywords\":[\"Anti-Doping\"],\"articleSection\":[\"News\"],\"inLanguage\":\"en\"},{\"@type\":\"WebPage\",\"@id\":\"https://uww.org/articles/ioc-determines-taymazov-fails-london-re-test\",\"url\":\"https://uww.org/articles/ioc-determines-taymazov-fails-london-re-test\",\"name\":\"IOC Determines Taymazov Fails London Re-Test\",\"description\":\"The IOC Disciplinary Commission (DC) rendered its decision against Artur TAYMAZOV (UZB) who failed a reanalysis of his anti-doping test at the 2012 Olympic Games in London.\",\"isPartOf\":{\"@id\":\"https://uww.org/#website\"},\"about\":{\"@id\":\"https://uww.org/#organization\"},\"mainEntity\":{\"@id\":\"https://uww.org/articles/ioc-determines-taymazov-fails-london-re-test#article\"},\"primaryImageOfPage\":{\"@id\":\"https://uww.org/articles/ioc-determines-taymazov-fails-london-re-test#primaryimage\"},\"image\":{\"@id\":\"https://uww.org/articles/ioc-determines-taymazov-fails-london-re-test#primaryimage\"},\"thumbnailUrl\":\"https://cdn.uww.org/styles/max_1300_16_9/public/2019-07/2644091-54704250-2560-1440.jpg?itok=04cSbNCi\",\"datePublished\":\"2019-07-26T13:13:10+00:00\",\"dateModified\":\"2019-07-26T13:17:27+00:00\",\"breadcrumb\":{\"@id\":\"https://uww.org/articles/ioc-determines-taymazov-fails-london-re-test#breadcrumb\"},\"inLanguage\":\"en\",\"potentialAction\":[{\"@type\":\"ReadAction\",\"target\":[\"https://uww.org/articles/ioc-determines-taymazov-fails-london-re-test\"]}]},{\"@type\":\"ImageObject\",\"@id\":\"https://uww.org/articles/ioc-determines-taymazov-fails-london-re-test#primaryimage\",\"url\":\"https://cdn.uww.org/styles/max_1300_16_9/public/2019-07/2644091-54704250-2560-1440.jpg?itok=04cSbNCi\",\"contentUrl\":\"https://cdn.uww.org/styles/max_1300_16_9/public/2019-07/2644091-54704250-2560-1440.jpg?itok=04cSbNCi\",\"captio /2019-07/2644091-54704250-2560-1440.jpg?itok=-RGFBs_o\",\"max_325_9_16\":\"https://cms.uww.org/s3/files/styles/max_325_9_16/public/2019-07/2644091-54704250-2560-1440.jpg?itok=qTQF8I8X\",\"max_650x650\":\"https://cdn.uww.org/styles/max_650x650/public/2019-07/2644091-54704250-2560-1440.jpg?itok=P5H-qcmW\",\"max_650_16_9\":\"https://cdn.uww.org/styles/max_650_16_9/public/2019-07/2644091-54704250-2560-1440.jpg?itok=f_a05HZ8\",\"max_650_19_9\":\"https://cms.uww.org/s3/files/styles/max_650_19_9/public/2019-07/2644091-54704250-2560-1440.jpg?itok=-W8sdjJM\",\"max_650_2_3\":\"https://cms.uww.org/s3/files/styles/max_650_2_3/public/2019-07/2644091-54704250-2560-1440.jpg?itok=BVMnvZyC\",\"max_650_3_2\":\"https://cdn.uww.org/styles/max_650_3_2/public/2019-07/2644091-54704250-2560-1440.jpg?itok=YhGw0B8m\",\"max_650_3_4\":\"https://cms.uww.org/s3/files/styles/max_650_3_4/public/2019-07/2644091-54704250-2560-1440.jpg?itok=56rCQCnI\",\"max_650_4_5\":\"https://cms.uww.org/s3/files/styles/max_650_4_5/public/2019-07/2644091-54704250-2560-1440.jpg?itok=GzVW1sC7\",\"max_650_9_16\":\"https://cms.uww.org/s3/files/styles/max_650_9_16/public/2019-07/2644091-54704250-2560-1440.jpg?itok=BrWdLLgq\",\"thumbnail_square\":\"https://cms.uww.org/s3/files/styles/thumbnail_square/public/2019-07/2644091-54704250-2560-1440.jpg?itok=Kpy4IFmZ\"}}},\"created\":\"2019-07-26T13:13:10+00:00\",\"sport_group\":[\"olympic\"],\"paragraphs\":[{\"type\":\"paragraph--wysiwyg\",\"id\":\"4b2be41d-3bd5-4793-949b-351df87bd5a1\",\"body\":\"\u003cblockquote\u003e\\n\u003cp\u003eCORSIER-SUR-VEVEY, Switzerland (July 26) – The IOC Disciplinary Commission (DC) rendered its decision against Artur TAYMAZOV (UZB) who failed a reanalysis of his anti-doping test at the 2012 Olympic Games in London. Taymazov tested positive for the prohibited substance dehydrochlormethyltestosterone (oral turinabol).\u003c/p\u003e\\n\\n\u003cp\u003eThe Uzbek wrestler had earned a gold medal in freestyle wrestling at 120kg and his removal will re-shuffle the order of medalists at the 2012 London Games. Komeil GHASEMI (IRI) will become the new gold medalist, Bilyal MAKHOV (RUS) remains silver, and Tervel DLAGNEV (USA) will be the newest bronze medalist.\u003c/p\u003e\\n\\n\u003cp\u003eGold: Komeil GHASEMI (IRI)\u003cbr /\u003e\\nSilver: Bilyal MAKHOV (RUS)\u003cbr /\u003e\\nBronze: Tervel DLAGNEV (USA)\u003cbr /\u003e\\nBronze: Daulet SHABANBAY (KAZ)\u003c/p\u003e\\n\\n\u003cp\u003eTaymazov may opt to appeal the IOC DC decision before CAS within 21 days. United World Wrestling will then determine the sanctions faced by the athlete.\u003c/p\u003e\\n\u003c/blockquote\u003e\"}],\"changed\":\"2019-07-26T13:17:27+00:00\",\"metadata\":{\"title\":\"IOC Determines Taymazov Fails London Re-Test | United World Wrestling\",\"description\":\"The IOC Disciplinary Commission (DC) rendered its decision against Artur TAYMAZOV (UZB) who failed a reanalysis of his anti-doping test at the 2012 Olympic Games in London.\",\"links\":{\"canonical\":\"/articles/ioc-determines-taymazov-fails-london-re-test\",\"alternate\":{\"x-default\":\"/articles/ioc-determines-taymazov-fails-london-re-test\",\"en\":\"/articles/ioc-determines-taymazov-fails-london-re-test\",\"fa\":\"/fa/mqalh/mrdwd-shdn-taymazwf-dr-azmaysh-mjdd-dwpyng-almpyk-lndn\"},\"image\":\"https://cdn.uww.org/styles/max_1300_16_9/public/2019-07/2644091-54704250-2560-1440.jpg?itok=04cSbNCi\",\"imageAlt\":\"IOC Determines Taymazov Fails London Re-Test\",\"imageWidth\":1300,\"imageHeight\":731},\"author\":\"United World Wrestling Press\",\"robots\":\"index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1\",\"openGraph\":{\"type\":\"article\",\"publishedTime\":\"2019-07-26T13:13:10+00:00\",\"modifiedTime\":\"2019-07-26T13:17:27+00:00\",\"authors\":[\"/authors/united-world-wrestling-press\"],\"section\":\"News\",\"tags\":[\"Anti-Doping\"]}}},\"coverContent\":\"$L71\",\"paragraphsContent\":\"$L72\"}]\n"])</script><script>self.__next_f.push([1,"69:[\"$\",\"aside\"
